name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    # Verification and race checks precede bounded disposable integration.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify Mantik
        run: make verify
      - name: Race checks
        run: make test-race
      - name: PostgreSQL lifecycle contracts
        run: make test-integration
      - name: Build container images
        run: make compose-build
